<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔑 密码生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0d1117; color: #e6edf3; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .back-link { display: inline-block; color: #58a6ff; text-decoration: none; margin-bottom: 20px; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
        h1 { text-align: center; margin-bottom: 8px; font-size: 2rem; color: #58a6ff; }
        .subtitle { text-align: center; color: #8b949e; margin-bottom: 32px; font-size: 0.9rem; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .card-title { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .result-box { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
        .result-box input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 14px; color: #79c0ff; font-family: 'Consolas', monospace; font-size: 1.2rem; text-align: center; }
        .btn { padding: 12px 20px; background: #238636; border: none; border-radius: 6px; color: #fff; cursor: pointer; font-size: 0.95rem; white-space: nowrap; }
        .btn:hover { background: #2ea043; }
        .btn-secondary { background: #21262d; color: #79c0ff; border: 1px solid #30363d; }
        .btn-secondary:hover { background: #30363d; }
        .option { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #30363d; }
        .option:last-child { border-bottom: none; }
        .option label { font-size: 0.9rem; }
        .slider-row { display: flex; align-items: center; gap: 12px; }
        input[type="range"] { flex: 1; }
        .strength { height: 8px; border-radius: 4px; background: #30363d; margin-top: 8px; overflow: hidden; }
        .strength-bar { height: 100%; width: 0; transition: all 0.3s; }
        .strength-text { text-align: center; margin-top: 8px; font-size: 0.85rem; color: #8b949e; }
        .history { font-family: 'Consolas', monospace; font-size: 0.85rem; color: #8b949e; }
        .history-item { padding: 6px 0; border-bottom: 1px solid #21262d; cursor: pointer; }
        .history-item:hover { color: #58a6ff; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 返回工具集</a>
        <h1>🔑 密码生成器</h1>
        <p class="subtitle">生成安全随机密码，支持自定义长度和字符集</p>

        <div class="card">
            <div class="card-title">🔒 生成的密码</div>
            <div class="result-box">
                <input type="text" id="password" readonly value="">
                <button class="btn" onclick="generate()">重新生成</button>
                <button class="btn btn-secondary" onclick="copyPwd()">复制</button>
            </div>
            <div class="strength"><div class="strength-bar" id="strengthBar"></div></div>
            <div class="strength-text" id="strengthText">强度：-</div>
        </div>

        <div class="card">
            <div class="card-title">⚙️ 选项</div>
            <div class="option">
                <label>密码长度</label>
                <div class="slider-row"><input type="range" id="length" min="4" max="128" value="16" oninput="updateLength()"><span id="lengthVal">16</span></div>
            </div>
            <div class="option">
                <label>包含大写字母 (A-Z)</label><input type="checkbox" id="upper" checked onchange="generate()">
            </div>
            <div class="option">
                <label>包含小写字母 (a-z)</label><input type="checkbox" id="lower" checked onchange="generate()">
            </div>
            <div class="option">
                <label>包含数字 (0-9)</label><input type="checkbox" id="digits" checked onchange="generate()">
            </div>
            <div class="option">
                <label>包含特殊符号 (!@#$...)</label><input type="checkbox" id="symbols" checked onchange="generate()">
            </div>
            <div class="option">
                <label>排除易混淆字符</label><input type="checkbox" id="excludeConfusing" onchange="generate()">
            </div>
        </div>

        <div class="card">
            <div class="card-title">📝 历史记录</div>
            <div class="history" id="history"></div>
            <button class="btn btn-secondary" onclick="clearHistory()" style="margin-top:12px;">清空历史</button>
        </div>
    </div>

    <script>
        const SETS = {
            upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lower: 'abcdefghijklmnopqrstuvwxyz',
            digits: '0123456789',
            symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
        };
        const CONFUSING = /[0Oo1Il]/g;
        let history = [];

        function updateLength() {
            document.getElementById('lengthVal').textContent = document.getElementById('length').value;
            generate();
        }

        function generate() {
            const len = parseInt(document.getElementById('length').value);
            const upper = document.getElementById('upper').checked;
            const lower = document.getElementById('lower').checked;
            const digits = document.getElementById('digits').checked;
            const symbols = document.getElementById('symbols').checked;
            const exclude = document.getElementById('excludeConfusing').checked;

            let pool = '';
            if (upper) pool += SETS.upper;
            if (lower) pool += SETS.lower;
            if (digits) pool += SETS.digits;
            if (symbols) pool += SETS.symbols;

            if (exclude) pool = pool.replace(CONFUSING, '');
            if (!pool) pool = SETS.lower;

            const arr = new Uint32Array(len);
            if (window.crypto && window.crypto.getRandomValues) {
                window.crypto.getRandomValues(arr);
            } else {
                for (let i = 0; i < len; i++) arr[i] = Math.floor(Math.random() * 0x100000000);
            }
            let pwd = '';
            for (let i = 0; i < len; i++) pwd += pool[arr[i] % pool.length];

            document.getElementById('password').value = pwd;
            evaluateStrength(pwd);

            if (!history.includes(pwd)) {
                history.unshift(pwd);
                if (history.length > 10) history.pop();
                renderHistory();
            }
        }

        function evaluateStrength(pwd) {
            let score = 0;
            if (pwd.length >= 8) score++;
            if (pwd.length >= 12) score++;
            if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
            if (/\d/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            const colors = ['#da3633', '#d29922', '#d29922', '#2ea043', '#2ea043'];
            const labels = ['非常弱', '弱', '一般', '强', '非常强'];
            const idx = Math.min(score - 1, 4);
            bar.style.width = ((score / 5) * 100) + '%';
            bar.style.backgroundColor = colors[idx] || '#30363d';
            text.textContent = '强度：' + (labels[idx] || '-');
        }

        function copyPwd() {
            const el = document.getElementById('password');
            el.select();
            document.execCommand('copy');
        }

        function renderHistory() {
            const el = document.getElementById('history');
            if (!history.length) { el.innerHTML = '<div style="color:#484f58">暂无记录</div>'; return; }
            el.innerHTML = history.map(p => '<div class="history-item" onclick="useHistory(this)">' + p + '</div>').join('');
        }

        function useHistory(item) {
            document.getElementById('password').value = item.textContent;
            evaluateStrength(item.textContent);
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }

        generate();
    </script>
</body>
</html>
