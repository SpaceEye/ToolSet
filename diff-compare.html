<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📄 文本对比工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            padding: 40px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .back-link { display: inline-block; color: #58a6ff; text-decoration: none; margin-bottom: 20px; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
        h1 { text-align: center; margin-bottom: 8px; font-size: 2rem; color: #58a6ff; }
        .subtitle { text-align: center; color: #8b949e; margin-bottom: 32px; font-size: 0.9rem; }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .card-title { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .pane-label { font-size: 0.85rem; color: #8b949e; margin-bottom: 8px; }
        .pane-label .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
        .dot-a { background: #da3633; }
        .dot-b { background: #2ea043; }

        textarea {
            width: 100%; min-height: 220px;
            padding: 14px; background: #0d1117;
            border: 1px solid #30363d; border-radius: 8px;
            color: #e6edf3; font-size: 0.88rem; font-family: monospace;
            resize: vertical; line-height: 1.6;
        }
        textarea:focus { outline: none; border-color: #58a6ff; }

        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
        .btn {
            padding: 10px 20px; border-radius: 6px; cursor: pointer;
            font-size: 0.9rem; border: 1px solid #30363d; transition: all 0.2s;
        }
        .btn-primary { background: #1f6feb; color: white; border-color: #1f6feb; }
        .btn-primary:hover { background: #3a7bd5; }
        .btn-danger { background: #da3633; color: white; border-color: #da3633; }
        .btn-danger:hover { background: #f85149; }

        .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; font-size: 0.9rem; }
        .stat { padding: 6px 14px; border-radius: 6px; background: #0d1117; }
        .stat-add { color: #2ea043; }
        .stat-del { color: #da3633; }
        .stat-same { color: #8b949e; }

        .diff-view {
            background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
            padding: 12px; max-height: 520px; overflow: auto;
            font-family: monospace; font-size: 0.85rem; line-height: 1.7;
        }
        .diff-row { display: flex; gap: 10px; white-space: pre-wrap; word-break: break-all; padding: 1px 6px; border-radius: 3px; }
        .diff-sign { flex-shrink: 0; width: 16px; text-align: center; color: #484f58; user-select: none; }
        .diff-line { flex: 1; }
        .diff-add { background: rgba(46, 160, 67, 0.15); }
        .diff-add .diff-sign { color: #2ea043; }
        .diff-add .diff-line { color: #7ee787; }
        .diff-del { background: rgba(218, 54, 51, 0.15); }
        .diff-del .diff-sign { color: #da3633; }
        .diff-del .diff-line { color: #ffa198; }
        .diff-same { color: #8b949e; }
        .empty { color: #8b949e; padding: 20px; text-align: center; font-family: 'Segoe UI', sans-serif; }

        @media (max-width: 700px) {
            body { padding: 20px; }
            h1 { font-size: 1.5rem; }
            .input-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 返回工具集</a>
        <h1>📄 文本对比工具</h1>
        <p class="subtitle">逐行对比两段文本，高亮显示新增与删除</p>

        <div class="card">
            <div class="card-title">✍️ 输入对比</div>
            <div class="input-grid">
                <div>
                    <div class="pane-label"><span class="dot dot-a"></span>文本 A（原始）</div>
                    <textarea id="textA" placeholder="粘贴原始文本...">const version = "1.0.0";
function add(a, b) {
    return a + b;
}
function mul(a, b) {
    return a * b;
}</textarea>
                </div>
                <div>
                    <div class="pane-label"><span class="dot dot-b"></span>文本 B（修改后）</div>
                    <textarea id="textB" placeholder="粘贴修改后的文本...">const version = "1.1.0";
function add(a, b) {
    return a + b;
}
function mul(a, b) {
    return a * b;
}
function div(a, b) {
    if (b === 0) throw new Error("除数不能为零");
    return a / b;
}</textarea>
                </div>
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" onclick="doDiff()">对比</button>
                <button class="btn btn-danger" onclick="clearAll()">清空</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📊 对比结果</div>
            <div class="stats" id="stats"></div>
            <div class="diff-view" id="diffView">
                <div class="empty">点击「对比」查看差异</div>
            </div>
        </div>
    </div>

    <script>
        // LCS 行级 diff（纯逻辑，可测试）
        function diffLines(a, b) {
            const A = String(a) === '' ? [] : String(a).split('\n');
            const B = String(b) === '' ? [] : String(b).split('\n');
            const m = A.length, n = B.length;
            if (m * n > 9000000) return { tooBig: true };
            const dp = [];
            for (let i = 0; i <= m; i++) dp.push(new Int32Array(n + 1));
            for (let i = m - 1; i >= 0; i--) {
                for (let j = n - 1; j >= 0; j--) {
                    dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
                }
            }
            const ops = [];
            let i = 0, j = 0;
            while (i < m && j < n) {
                if (A[i] === B[j]) { ops.push({ t: 'same', l: A[i] }); i++; j++; }
                else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: 'del', l: A[i] }); i++; }
                else { ops.push({ t: 'add', l: B[j] }); j++; }
            }
            while (i < m) ops.push({ t: 'del', l: A[i++] });
            while (j < n) ops.push({ t: 'add', l: B[j++] });
            return { tooBig: false, ops };
        }

        function doDiff() {
            const a = document.getElementById('textA').value;
            const b = document.getElementById('textB').value;
            const result = diffLines(a, b);
            const statsEl = document.getElementById('stats');
            const view = document.getElementById('diffView');

            if (result.tooBig) {
                statsEl.innerHTML = '';
                view.innerHTML = '<div class="empty">文本过长（行数乘积超过 900 万），请缩小对比范围</div>';
                return;
            }

            const adds = result.ops.filter(o => o.t === 'add').length;
            const dels = result.ops.filter(o => o.t === 'del').length;
            const same = result.ops.filter(o => o.t === 'same').length;

            statsEl.innerHTML =
                '<span class="stat stat-add">+ ' + adds + ' 新增</span>' +
                '<span class="stat stat-del">− ' + dels + ' 删除</span>' +
                '<span class="stat stat-same">= ' + same + ' 相同</span>';

            if (adds === 0 && dels === 0) {
                view.innerHTML = '<div class="empty">✓ 两段文本完全相同</div>';
                return;
            }

            view.innerHTML = result.ops.map(op => {
                const cls = op.t;
                const sign = op.t === 'same' ? ' ' : op.t === 'add' ? '+' : '−';
                const line = op.l === '' ? '&nbsp;' : escapeHtml(op.l);
                return '<div class="diff-row diff-' + cls + '">' +
                    '<span class="diff-sign">' + sign + '</span>' +
                    '<span class="diff-line">' + line + '</span></div>';
            }).join('');
        }

        function clearAll() {
            document.getElementById('textA').value = '';
            document.getElementById('textB').value = '';
            document.getElementById('stats').innerHTML = '';
            document.getElementById('diffView').innerHTML = '<div class="empty">点击「对比」查看差异</div>';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>
</html>
