<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 FPS 准星生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',sans-serif;min-height:100vh;padding:40px}
.container{max-width:900px;margin:0 auto}
.back-link{display:inline-block;color:#58a6ff;text-decoration:none;margin-bottom:20px;font-size:.9rem}
.back-link:hover{text-decoration:underline}
h1{margin-bottom:8px;font-size:2rem;color:#a371f7}
.subtitle{color:#8b949e;margin-bottom:32px;font-size:.95rem}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;margin-bottom:20px}
.row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
label{display:block;color:#8b949e;margin-bottom:4px;font-size:.85rem}
input,select{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 14px;color:#e6edf3;font-size:.95rem;width:100%;transition:all .2s}
input:focus,select:focus{outline:none;border-color:#a371f7;box-shadow:0 0 0 3px rgba(163,113,247,.15)}
textarea{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 14px;color:#e6edf3;font-size:.95rem;width:100%;font-family:monospace;resize:vertical;transition:all .2s}
textarea:focus{outline:none;border-color:#a371f7}
.btn{background:#238636;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{background:#2ea043}
.btn-secondary{background:#21262d;color:#e6edf3;border:1px solid #30363d}
.btn-secondary:hover{background:#30363d;border-color:#8b949e}
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:16px}
.result-item{background:#0d1117;border-radius:8px;padding:16px;text-align:center}
.result-item .val{font-size:1.8rem;font-weight:bold;color:#a371f7;margin:8px 0}
.result-item .lbl{color:#8b949e;font-size:.8rem}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #21262d}
th{color:#8b949e;font-size:.8rem;font-weight:normal}
td{color:#e6edf3;font-size:.9rem}
tr:hover td{background:rgba(163,113,247,.05)}
.footer{text-align:center;margin-top:48px;color:#484f58;font-size:.8rem}
@media(max-width:600px){body{padding:20px}.row{flex-direction:column}}
</style>
</head>
<body>
<div class="container">
<a class="back-link" href="index.html">← 返回工具集</a>
<h1>🎯 FPS 准星生成器</h1>
<p class="subtitle">自定义颜色、间隙、粗细与长度，生成 SVG 准星代码（通用 FPS）</p>
<div class="card">
<div class="row">
<div style="flex:1"><label>准星颜色</label>
<input type="color" id="crossColor" value="#00ff00" style="height:40px;padding:4px"></div>
<div style="flex:1"><label>中心点间隙(px)</label><input type="number" id="gapSize" value="8" min="0" max="50"></div>
<div style="flex:1"><label>线条粗细(px)</label><input type="number" id="lineWidth" value="2" min="1" max="10"></div>
<div style="flex:1"><label>准星长度(px)</label><input type="number" id="crossLength" value="20" min="5" max="100"></div>
</div>
<div class="row">
<label style="display:flex;align-items:center;gap:8px">
<input type="checkbox" id="showDot"> 显示中心点
</label>
<label style="display:flex;align-items:center;gap:8px">
<input type="checkbox" id="showOutlines"> 显示轮廓
</label>
</div>
<div id="crossPreview" style="text-align:center;padding:30px;background:#111;border-radius:8px;margin-bottom:16px"></div>
<button class="btn" onclick="generateCSS()">生成 SVG 代码</button>
<button class="btn btn-secondary" onclick="copyCrosshair()" style="margin-left:8px">复制</button>
<div id="cssOutput" style="margin-top:12px"></div>
</div>
<div class="footer">© 2026 SpacePioneer · 保留所有权利</div>
</div>
<script>
function generateCSS(){var color=document.getElementById('crossColor').value;var gap=parseInt(document.getElementById('gapSize').value)||8;var lw=parseInt(document.getElementById('lineWidth').value)||2;var len=parseInt(document.getElementById('crossLength').value)||20;var dot=document.getElementById('showDot').checked;var outline=document.getElementById('showOutlines').checked;var size=len*2+gap+lw;var cx=len+gap+lw/2;var cy=len+gap+lw/2;var endPt=len-gap-lw;var svg='<svg width="'+size+'" height="'+size+'" xmlns="http://www.w3.org/2000/svg">\n';svg+='  <g stroke="'+color+'" stroke-width="'+lw+'" fill="none">\n';svg+='    <line x1="'+cx+'" y1="'+(cy-gap)+'" x2="'+cx+'" y2="'+(cy-gap-endPt)+'"/>\n';svg+='    <line x1="'+cx+'" y1="'+(cy+gap)+'" x2="'+cx+'" y2="'+(cy+gap+endPt)+'"/>\n';svg+='    <line x1="'+(cx-gap)+'" y1="'+cy+'" x2="'+(cx-gap-endPt)+'" y2="'+cy+'"/>\n';svg+='    <line x1="'+(cx+gap)+'" y1="'+cy+'" x2="'+(cx+gap+endPt)+'" y2="'+cy+'"/>\n';if(dot){svg+='    <rect x="'+(cx-lw/2)+'" y="'+(cy-lw/2)+'" width="'+lw+'" height="'+lw+'" fill="'+color+'"/>\n';}svg+='  </g>\n';if(outline){svg+='  <g stroke="'+color+'" stroke-width="1" fill="none" opacity=".5">\n';svg+='    <line x1="'+(cx-gap)+'" y1="'+cy+'" x2="'+(cx+gap)+'" y2="'+cy+'"/>\n';svg+='    <line x1="'+cx+'" y1="'+(cy-gap)+'" x2="'+cx+'" y2="'+(cy+gap)+'"/>\n';svg+='  </g>\n';}svg+='</svg>';document.getElementById('crossPreview').innerHTML=svg;document.getElementById('cssOutput').innerHTML='<pre style="background:#0d1117;padding:12px;border-radius:8px;font-size:.85rem;overflow-x:auto;color:#7ee787">'+escapeHtml(svg)+'</pre>';}
function escapeHtml(str){return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyCrosshair(){var el=document.getElementById('cssOutput');if(el&&el.textContent){navigator.clipboard.writeText(el.textContent).then(function(){var btns=document.querySelectorAll('.card button');btns.forEach(function(b){if(b.textContent==='复制'){b.textContent='✓ 已复制';setTimeout(function(){b.textContent='复制';},2000);}});});}}
generateCSS();
</script>
</body>
</html>
