<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🟢 Minecraft 经验计算器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',sans-serif;min-height:100vh;padding:40px}
.container{max-width:900px;margin:0 auto}
.back-link{display:inline-block;color:#58a6ff;text-decoration:none;margin-bottom:20px;font-size:.9rem}
.back-link:hover{text-decoration:underline}
h1{margin-bottom:8px;font-size:2rem;color:#a371f7}
.subtitle{color:#8b949e;margin-bottom:32px;font-size:.95rem}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;margin-bottom:20px}
.row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
label{display:block;color:#8b949e;margin-bottom:4px;font-size:.85rem}
input,select{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 14px;color:#e6edf3;font-size:.95rem;width:100%;transition:all .2s}
input:focus,select:focus{outline:none;border-color:#a371f7;box-shadow:0 0 0 3px rgba(163,113,247,.15)}
textarea{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 14px;color:#e6edf3;font-size:.95rem;width:100%;font-family:monospace;resize:vertical;transition:all .2s}
textarea:focus{outline:none;border-color:#a371f7}
.btn{background:#238636;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{background:#2ea043}
.btn-secondary{background:#21262d;color:#e6edf3;border:1px solid #30363d}
.btn-secondary:hover{background:#30363d;border-color:#8b949e}
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:16px}
.result-item{background:#0d1117;border-radius:8px;padding:16px;text-align:center}
.result-item .val{font-size:1.8rem;font-weight:bold;color:#a371f7;margin:8px 0}
.result-item .lbl{color:#8b949e;font-size:.8rem}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #21262d}
th{color:#8b949e;font-size:.8rem;font-weight:normal}
td{color:#e6edf3;font-size:.9rem}
tr:hover td{background:rgba(163,113,247,.05)}
.footer{text-align:center;margin-top:48px;color:#484f58;font-size:.8rem}
@media(max-width:600px){body{padding:20px}.row{flex-direction:column}}
</style>
</head>
<body>
<div class="container">
<a class="back-link" href="index.html">← 返回工具集</a>
<h1>⛏️ Minecraft 经验计算器</h1>
<p class="subtitle">计算升级所需总经验值 + 1-50 级附魔经验需求表（MCBBS 标准 XP 表）</p>
<div class="card">
<h2 style="color:#e6edf3;margin-bottom:16px">经验值计算器 🟢</h2>
<p style="color:#8b949e;font-size:.85rem;margin-bottom:16px">计算从当前等级到目标等级需要的总经验值（按 MCBBS 标准 XP 表）</p>
<div class="row">
<div style="flex:1"><label>起始等级</label><input type="number" id="mcStartLevel" value="0" min="0" max="100"></div>
<div style="flex:1"><label>目标等级</label><input type="number" id="mcEndLevel" value="30" min="1" max="100"></div>
</div>
<button class="btn" onclick="calcExp()">计算</button>
<div id="expResult"></div>
</div>
<div class="card">
<h2 style="color:#e6edf3;margin-bottom:16px">附魔成本查询 🔮</h2>
<p style="color:#8b949e;font-size:.85rem;margin-bottom:16px">查看每个等级的附魔经验需求</p>
<table>
<thead><tr><th>等级</th><th>升级所需XP</th><th>累计XP</th></tr></thead>
<tbody id="enchantTable"></tbody>
</table>
</div>
<div class="footer">© 2026 SpacePioneer · 保留所有权利</div>
</div>
<script>
function mcXP(lvl){if(lvl<=16)return lvl*lvl+6*lvl;if(lvl<=31)return Math.floor(2.5*lvl*lvl-40.5*lvl+360);return Math.floor(4.5*lvl*lvl-162.5*lvl+2220);}
function calcExp(){var s=parseInt(document.getElementById('mcStartLevel').value)||0;var e=parseInt(document.getElementById('mcEndLevel').value)||30;if(e<=s){document.getElementById('expResult').innerHTML='<p style="color:#f85149">目标等级必须大于起始等级</p>';return;}var total=mcXP(e)-mcXP(s);var avg=Math.floor(total/(e-s));var h='<div class="result-grid">';h+='<div class="result-item"><div class="lbl">'+s+'→'+e+' 级</div><div class="val">'+total+'</div><div class="lbl">总经验值</div></div>';h+='<div class="result-item"><div class="lbl">平均</div><div class="val">'+avg+'</div><div class="lbl">每级所需XP</div></div>';h+='</div>';h+='<details style="margin-top:16px"><summary style="color:#8b949e;cursor:pointer;user-select:none">展开详情 →</summary><table><thead><tr><th>等级</th><th>本升级需XP</th></tr></thead><tbody>';for(var i=s;i<e;i++){h+='<tr><td>'+i+'→'+(i+1)+'</td><td>'+(mcXP(i+1)-mcXP(i))+'</td></tr>';}h+='</tbody></details>';document.getElementById('expResult').innerHTML=h;}
(function buildEnchantTable(){var t=document.getElementById('enchantTable');var h='';var cumXP=0;for(var i=1;i<=50;i++){var prevXP=i>1?mcXP(i-1):0;var lvlXP=mcXP(i)-prevXP;cumXP+=lvlXP;h+='<tr><td>'+i+'</td><td>'+lvlXP+'</td><td>'+cumXP+'</td></tr>';}t.innerHTML=h;})();
calcExp();
</script>
</body>
</html>
