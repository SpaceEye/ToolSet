<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔗 URL 编解码器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            padding: 40px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .back-link { display: inline-block; color: #58a6ff; text-decoration: none; margin-bottom: 20px; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
        h1 { text-align: center; margin-bottom: 8px; font-size: 2rem; color: #58a6ff; }
        .subtitle { text-align: center; color: #8b949e; margin-bottom: 32px; font-size: 0.9rem; }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .card-title { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

        textarea {
            width: 100%; min-height: 120px;
            padding: 16px; background: #0d1117;
            border: 1px solid #30363d; border-radius: 8px;
            color: #e6edf3; font-size: 0.9rem; font-family: monospace;
            resize: vertical; line-height: 1.6;
        }
        textarea:focus { outline: none; border-color: #58a6ff; }

        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; justify-content: center; }
        .btn {
            padding: 10px 24px; border-radius: 6px; cursor: pointer;
            font-size: 0.9rem; border: 1px solid #30363d; transition: all 0.2s;
        }
        .btn-encode { background: #1f6feb; color: white; border-color: #1f6feb; }
        .btn-encode:hover { background: #3a7bd5; }
        .btn-decode { background: #238636; color: white; border-color: #238636; }
        .btn-decode:hover { background: #2ea043; }
        .btn-comp { background: #8957e5; color: white; border-color: #8957e5; }
        .btn-comp:hover { background: #a371f7; }
        .btn-danger { background: #da3633; color: white; border-color: #da3633; }

        /* URL Parser */
        .url-parts {
            display: grid;
            gap: 10px;
            margin-top: 16px;
        }
        .url-part-row {
            display: flex; gap: 10px; align-items: center;
            padding: 8px 12px; background: #0d1117; border-radius: 6px;
        }
        .url-part-label {
            color: #8b949e; font-size: 0.85rem; min-width: 80px; flex-shrink: 0;
        }
        .url-part-value {
            color: #79c0ff; font-family: monospace; font-size: 0.9rem;
            word-break: break-all; flex: 1;
        }

        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 16px; background: #0d1117; border-radius: 8px;
            margin-top: 12px; font-size: 0.85rem;
        }
        .status-ok { color: #2ea043; }
        .status-error { color: #da3633; }
        .status-info { color: #8b949e; }

        .copy-btn {
            padding: 6px 14px; background: #21262d; border: 1px solid #30363d;
            color: #8b949e; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
        }
        .copy-btn:hover { background: #30363d; color: #e6edf3; }
        .copy-btn.copied { background: #238636; color: white; border-color: #238636; }

        .tabs { display: flex; gap: 4px; margin-bottom: 16px; background: #21262d; padding: 4px; border-radius: 8px; }
        .tab-btn {
            flex: 1; padding: 10px; text-align: center; cursor: pointer;
            border-radius: 6px; font-size: 0.9rem; color: #8b949e;
            transition: all 0.2s; border: none; background: transparent;
        }
        .tab-btn.active { background: #1f6feb; color: white; }
        .tab-section { display: none; }
        .tab-section.active { display: block; }

        @media (max-width: 600px) {
            body { padding: 20px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 返回工具集</a>
        <h1>🔗 URL 编解码器</h1>
        <p class="subtitle">URL 编码/解码，URL 组成部分解析</p>

        <div class="tabs">
            <button class="tab-btn active" data-tab="encode">编码/解码</button>
            <button class="tab-btn" data-tab="parse">URL 解析</button>
        </div>

        <!-- Encode/Decode Tab -->
        <div class="tab-section active" id="tab-encode">
            <div class="card">
                <div class="card-title">📝 原始文本</div>
                <textarea id="decodedInput" placeholder="https://example.com/search?q=你好世界&page=1"></textarea>
            </div>

            <div class="btn-row">
                <button class="btn btn-encode" onclick="encodeURI_()">encodeURI</button>
                <button class="btn btn-comp" onclick="encodeComp()">encodeURIComponent</button>
                <button class="btn btn-decode" onclick="decodeURI_()">decodeURI</button>
                <button class="btn btn-danger" onclick="clearAll()">✕ 清空</button>
            </div>

            <div class="card">
                <div class="card-title">🔒 编码结果</div>
                <textarea id="encodedInput" placeholder="%E4%BD%A0%E5%A5%BD%E4%B8%96%E7%95%8C"></textarea>
                <div class="status-bar">
                    <span id="status" class="status-info">—</span>
                    <button class="copy-btn" onclick="copyText('encodedInput', this)">复制</button>
                </div>
            </div>
        </div>

        <!-- Parse Tab -->
        <div class="tab-section" id="tab-parse">
            <div class="card">
                <div class="card-title">🔍 输入 URL</div>
                <textarea id="urlInput" style="min-height:80px" placeholder="https://www.example.com:8080/path/page?key=value&name=张三#section"
                    oninput="parseURL()">https://www.example.com:8080/api/search?q=%E4%BD%A0%E5%A5%BD&page=2&limit=10#results</textarea>
                <div class="url-parts" id="urlParts"></div>
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });

        const decodedInput = document.getElementById('decodedInput');
        const encodedInput = document.getElementById('encodedInput');
        const statusEl = document.getElementById('status');

        function encodeURI_() {
            try {
                const result = encodeURI(decodedInput.value);
                encodedInput.value = result;
                statusEl.textContent = '✓ encodeURI 完成 · ' + result.length + ' 字符';
                statusEl.className = 'status-ok';
            } catch (e) {
                statusEl.textContent = '❌ 编码失败: ' + e.message;
                statusEl.className = 'status-error';
            }
        }

        function encodeComp() {
            try {
                const result = encodeURIComponent(decodedInput.value);
                encodedInput.value = result;
                statusEl.textContent = '✓ encodeURIComponent 完成 · ' + result.length + ' 字符';
                statusEl.className = 'status-ok';
            } catch (e) {
                statusEl.textContent = '❌ 编码失败: ' + e.message;
                statusEl.className = 'status-error';
            }
        }

        function decodeURI_() {
            try {
                const result = decodeURIComponent(encodedInput.value);
                decodedInput.value = result;
                statusEl.textContent = '✓ 解码完成 · ' + result.length + ' 字符';
                statusEl.className = 'status-ok';
            } catch (e) {
                statusEl.textContent = '❌ 解码失败: 无效的编码字符串';
                statusEl.className = 'status-error';
            }
        }

        function clearAll() {
            decodedInput.value = '';
            encodedInput.value = '';
            statusEl.textContent = '—';
            statusEl.className = 'status-info';
        }

        function parseURL() {
            const url = document.getElementById('urlInput').value.trim();
            const container = document.getElementById('urlParts');

            if (!url) { container.innerHTML = ''; return; }

            try {
                const u = new URL(url);
                const parts = [
                    { label: '协议', value: u.protocol },
                    { label: '主机名', value: u.hostname },
                    { label: '端口', value: u.port || '(默认)' },
                    { label: '路径', value: u.pathname },
                    { label: '查询字符串', value: u.search },
                    { label: '锚点', value: u.hash || '(无)' },
                ];

                // Parse query params
                const params = [];
                u.searchParams.forEach((val, key) => {
                    params.push({ label: '  参数: ' + key, value: val });
                });

                let html = parts.map(p => `
                    <div class="url-part-row">
                        <span class="url-part-label">${p.label}</span>
                        <span class="url-part-value">${p.value}</span>
                    </div>
                `).join('');

                if (params.length > 0) {
                    html += '<div style="margin-top:8px;font-size:0.85rem;color:#8b949e;">📋 查询参数:</div>';
                    html += params.map(p => `
                        <div class="url-part-row">
                            <span class="url-part-label">${p.label}</span>
                            <span class="url-part-value">${p.value}</span>
                        </div>
                    `).join('');
                }

                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<div style="color:#da3633;font-size:0.9rem;padding:12px;">❌ 无效的 URL: ' + e.message + '</div>';
            }
        }

        function copyText(id, btn) {
            const text = document.getElementById(id).value;
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '已复制';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
            });
        }

        // Initial parse
        parseURL();
    </script>
</body>
</html>
