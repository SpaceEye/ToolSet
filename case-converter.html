<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔠 字符串大小写转换</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            padding: 40px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .back-link { display: inline-block; color: #58a6ff; text-decoration: none; margin-bottom: 20px; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
        h1 { text-align: center; margin-bottom: 8px; font-size: 2rem; color: #58a6ff; }
        .subtitle { text-align: center; color: #8b949e; margin-bottom: 32px; font-size: 0.9rem; }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .card-title { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

        textarea {
            width: 100%; min-height: 110px;
            padding: 16px; background: #0d1117;
            border: 1px solid #30363d; border-radius: 8px;
            color: #e6edf3; font-size: 0.95rem; font-family: monospace;
            resize: vertical; line-height: 1.6;
        }
        textarea:focus { outline: none; border-color: #58a6ff; }

        .result-grid { display: grid; gap: 10px; }
        .result-row {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; background: #0d1117; border-radius: 8px;
        }
        .result-label {
            color: #8b949e; font-size: 0.8rem; min-width: 130px; flex-shrink: 0;
            font-family: monospace;
        }
        .result-value {
            color: #79c0ff; font-family: monospace; font-size: 0.9rem;
            word-break: break-all; flex: 1;
        }
        .copy-btn {
            padding: 4px 12px; background: #21262d; border: 1px solid #30363d;
            color: #8b949e; border-radius: 4px; cursor: pointer; font-size: 0.75rem; flex-shrink: 0;
        }
        .copy-btn:hover { background: #30363d; color: #e6edf3; }
        .copy-btn.copied { background: #238636; color: white; border-color: #238636; }

        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .btn {
            padding: 9px 18px; border-radius: 6px; cursor: pointer;
            font-size: 0.88rem; border: 1px solid #30363d; transition: all 0.2s;
        }
        .btn-secondary { background: #21262d; color: #e6edf3; }
        .btn-secondary:hover { background: #30363d; }
        .btn-danger { background: #da3633; color: white; border-color: #da3633; }
        .btn-danger:hover { background: #f85149; }

        @media (max-width: 600px) {
            body { padding: 20px; }
            h1 { font-size: 1.5rem; }
            .result-label { min-width: 100px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 返回工具集</a>
        <h1>🔠 字符串大小写转换</h1>
        <p class="subtitle">camelCase · snake_case · kebab-case · CONSTANT_CASE 等 8 种命名风格</p>

        <div class="card">
            <div class="card-title">📝 输入文本</div>
            <textarea id="input" placeholder="输入任意文本，支持 helloWorld / hello_world / hello-world / hello world"
                oninput="convertAll()">hello_world_example</textarea>
            <div class="btn-row">
                <button class="btn btn-secondary" onclick="copyAll()">复制全部</button>
                <button class="btn btn-danger" onclick="clearAll()">清空</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📤 转换结果（实时）</div>
            <div class="result-grid" id="results"></div>
        </div>
    </div>

    <script>
        function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1); }

        function splitWords(s) {
            s = s.trim()
                .replace(/[_\-./\\]+/g, ' ')
                .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
                .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2');
            return s.split(/\s+/).filter(Boolean).map(w => w.toLowerCase());
        }

        function toCamel(s) {
            const w = splitWords(s);
            return w.map((x, i) => i === 0 ? x : cap(x)).join('');
        }
        function toPascal(s) { return splitWords(s).map(cap).join(''); }
        function toSnake(s) { return splitWords(s).join('_'); }
        function toKebab(s) { return splitWords(s).join('-'); }
        function toConst(s) { return splitWords(s).join('_').toUpperCase(); }
        function toDot(s) { return splitWords(s).join('.'); }
        function toSentence(s) {
            const w = splitWords(s);
            if (!w.length) return '';
            return w.join(' ').charAt(0).toUpperCase() + w.join(' ').slice(1);
        }
        function toTitle(s) { return splitWords(s).map(cap).join(' '); }

        const FORMATS = [
            { name: 'camelCase', fn: toCamel },
            { name: 'PascalCase', fn: toPascal },
            { name: 'snake_case', fn: toSnake },
            { name: 'kebab-case', fn: toKebab },
            { name: 'CONSTANT_CASE', fn: toConst },
            { name: 'dot.case', fn: toDot },
            { name: 'Sentence case', fn: toSentence },
            { name: 'Title Case', fn: toTitle },
        ];

        function convertAll() {
            const text = document.getElementById('input').value;
            const container = document.getElementById('results');
            if (!text.trim()) {
                container.innerHTML = '<div style="color:#8b949e;padding:12px;">输入文本后自动转换...</div>';
                return;
            }
            container.innerHTML = FORMATS.map(f => {
                const val = f.fn(text);
                return '<div class="result-row">' +
                    '<span class="result-label">' + f.name + '</span>' +
                    '<span class="result-value">' + escapeHtml(val) + '</span>' +
                    '<button class="copy-btn" onclick="copyVal(\'' + escapeAttr(val) + '\', this)">复制</button>' +
                    '</div>';
            }).join('');
        }

        function copyAll() {
            const text = document.getElementById('input').value;
            if (!text.trim()) return;
            const all = FORMATS.map(f => f.name + ': ' + f.fn(text)).join('\n');
            navigator.clipboard.writeText(all).then(() => {
                const btn = document.querySelector('.btn-secondary');
                btn.textContent = '已复制';
                setTimeout(() => { btn.textContent = '复制全部'; }, 1500);
            });
        }

        function clearAll() {
            document.getElementById('input').value = '';
            convertAll();
        }

        function copyVal(val, btn) {
            navigator.clipboard.writeText(val).then(() => {
                btn.textContent = '已复制';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1200);
            });
        }

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function escapeAttr(s) {
            return s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        convertAll();
    </script>
</body>
</html>
