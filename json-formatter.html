<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{ } JSON 格式化器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            padding: 40px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .back-link { display: inline-block; color: #58a6ff; text-decoration: none; margin-bottom: 20px; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
        h1 { text-align: center; margin-bottom: 8px; font-size: 2rem; color: #58a6ff; }
        .subtitle { text-align: center; color: #8b949e; margin-bottom: 32px; font-size: 0.9rem; }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .card-title { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

        textarea {
            width: 100%; min-height: 200px;
            padding: 16px; background: #0d1117;
            border: 1px solid #30363d; border-radius: 8px;
            color: #e6edf3; font-size: 0.9rem; font-family: monospace;
            resize: vertical; line-height: 1.6;
        }
        textarea:focus { outline: none; border-color: #58a6ff; }

        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
        .btn {
            padding: 10px 20px; border-radius: 6px; cursor: pointer;
            font-size: 0.9rem; border: 1px solid #30363d; transition: all 0.2s;
        }
        .btn-primary { background: #1f6feb; color: white; border-color: #1f6feb; }
        .btn-primary:hover { background: #3a7bd5; }
        .btn-secondary { background: #21262d; color: #e6edf3; }
        .btn-secondary:hover { background: #30363d; }
        .btn-danger { background: #da3633; color: white; border-color: #da3633; }
        .btn-danger:hover { background: #f85149; }

        .output-box {
            width: 100%; min-height: 200px;
            padding: 16px; background: #0d1117;
            border: 1px solid #30363d; border-radius: 8px;
            font-family: monospace; font-size: 0.9rem;
            line-height: 1.6; white-space: pre-wrap;
            word-break: break-all; overflow: auto;
            max-height: 500px;
        }

        /* Syntax highlighting */
        .json-key { color: #79c0ff; }
        .json-string { color: #a5d6ff; }
        .json-number { color: #f9e2af; }
        .json-bool { color: #ff7b72; }
        .json-null { color: #ff7b72; }
        .json-bracket { color: #8b949e; }

        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: #0d1117; border-radius: 8px;
            margin-top: 12px; font-size: 0.85rem;
        }
        .status-ok { color: #2ea043; }
        .status-error { color: #da3633; }
        .status-info { color: #8b949e; }

        .copy-btn {
            padding: 6px 14px; background: #21262d; border: 1px solid #30363d;
            color: #8b949e; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
            transition: all 0.2s;
        }
        .copy-btn:hover { background: #30363d; color: #e6edf3; }
        .copy-btn.copied { background: #238636; color: white; border-color: #238636; }

        @media (max-width: 600px) {
            body { padding: 20px; }
            h1 { font-size: 1.5rem; }
            .btn-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 返回工具集</a>
        <h1>{ } JSON 格式化器</h1>
        <p class="subtitle">格式化、压缩、校验 JSON 数据，支持语法高亮</p>

        <div class="card">
            <div class="card-title">📝 输入 JSON</div>
            <textarea id="input" placeholder='{"name":"张三","age":28,"hobbies":["编程","阅读"]}'></textarea>
            <div class="btn-row">
                <button class="btn btn-primary" onclick="formatJSON()">✨ 格式化</button>
                <button class="btn btn-secondary" onclick="compressJSON()">📦 压缩</button>
                <button class="btn btn-secondary" onclick="validateJSON()">✓ 校验</button>
                <button class="btn btn-danger" onclick="clearAll()">✕ 清空</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📤 输出结果</div>
            <div class="output-box" id="output">等待输入...</div>
            <div class="status-bar">
                <span id="status" class="status-info">—</span>
                <button class="copy-btn" id="copyBtn" onclick="copyOutput(this)" style="display:none">复制</button>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        const copyBtn = document.getElementById('copyBtn');
        let lastOutput = '';

        function syntaxHighlight(json) {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(
                /("(\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
                function(match) {
                    let cls = 'json-number';
                    if (/^"/.test(match)) {
                        cls = /:$/.test(match) ? 'json-key' : 'json-string';
                    } else if (/true|false/.test(match)) {
                        cls = 'json-bool';
                    } else if (/null/.test(match)) {
                        cls = 'json-null';
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                }
            );
        }

        function formatJSON() {
            try {
                const parsed = JSON.parse(input.value);
                const formatted = JSON.stringify(parsed, null, 2);
                lastOutput = formatted;
                output.innerHTML = syntaxHighlight(formatted);
                status.textContent = '✓ 格式化成功 · ' + countInfo(parsed);
                status.className = 'status-ok';
                copyBtn.style.display = 'inline-block';
            } catch (e) {
                output.textContent = '❌ JSON 解析错误:\n' + e.message;
                status.textContent = '✗ 解析失败';
                status.className = 'status-error';
                copyBtn.style.display = 'none';
            }
        }

        function compressJSON() {
            try {
                const parsed = JSON.parse(input.value);
                const compressed = JSON.stringify(parsed);
                lastOutput = compressed;
                output.textContent = compressed;
                status.textContent = '✓ 压缩成功 · ' + compressed.length + ' 字符';
                status.className = 'status-ok';
                copyBtn.style.display = 'inline-block';
            } catch (e) {
                output.textContent = '❌ JSON 解析错误:\n' + e.message;
                status.textContent = '✗ 解析失败';
                status.className = 'status-error';
                copyBtn.style.display = 'none';
            }
        }

        function validateJSON() {
            try {
                const parsed = JSON.parse(input.value);
                output.innerHTML = '<span class="json-bool">✓ 有效的 JSON</span>\n\n' + syntaxHighlight(JSON.stringify(parsed, null, 2));
                lastOutput = JSON.stringify(parsed, null, 2);
                status.textContent = '✓ 校验通过 · ' + countInfo(parsed);
                status.className = 'status-ok';
                copyBtn.style.display = 'inline-block';
            } catch (e) {
                output.textContent = '❌ 无效的 JSON:\n' + e.message;
                status.textContent = '✗ 校验失败';
                status.className = 'status-error';
                copyBtn.style.display = 'none';
            }
        }

        function countInfo(obj) {
            const str = JSON.stringify(obj);
            const keys = (str.match(/"[^"]*"\s*:/g) || []).length;
            const type = Array.isArray(obj) ? '数组' : typeof obj === 'object' ? '对象' : typeof obj;
            return type + ' · ' + keys + ' 个键 · ' + str.length + ' 字符';
        }

        function clearAll() {
            input.value = '';
            output.textContent = '等待输入...';
            status.textContent = '—';
            status.className = 'status-info';
            copyBtn.style.display = 'none';
            lastOutput = '';
        }

        function copyOutput(btn) {
            navigator.clipboard.writeText(lastOutput).then(() => {
                btn.textContent = '已复制';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
            });
        }

        // Live validate on input
        input.addEventListener('input', () => {
            if (!input.value.trim()) {
                status.textContent = '—';
                status.className = 'status-info';
                return;
            }
            try {
                JSON.parse(input.value);
                status.textContent = '✓ 有效的 JSON';
                status.className = 'status-ok';
            } catch (e) {
                status.textContent = '✗ ' + e.message;
                status.className = 'status-error';
            }
        });
    </script>
</body>
</html>
